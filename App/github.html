<style>
  #github_dialog {
    top: 200px;
  }
  #git_status {
    width: 100%;
    height: 200px;
  }
</style>

<div class="modal" tabindex="-1" role="dialog" id="github_dialog">

  


  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Choose repository</h5>
        <div
          type="button"
          class="close"
          data-bs-dismiss="modal"
          aria-label="Close"
          id="fadeout_github"
        >
          &times;
        </div>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="current_repo">Your repository is at:</label>
          <input type="text" class="form-control" id="current_repo" placeholder="Your repository" disabled>
          <button class="btn btn-primary bi-search" id="find_repo_btn">Choose repo</button>
        </div>
    </div>
  </div>
</div>
<script>

$("#find_repo_btn").on("click", function(){
  bootbox.confirm("Are you sure you want to change repositories? If so, you may want to press CTRL-S to save any changes to this repository before you switch", function(result){
    if(result){
      var path = CElectron.find_path()[0];
      console.log(path)
      if(typeof(path) !== "undefined"){
        user.current.path = path;
      }
      Collector.save_user();
      location.reload();
    }
  });

});
</script>

<script src="github.js"></script>
